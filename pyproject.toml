[project]
name = "vector-forge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Madhur", email = "madhurchouhan7@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "scikit-learn>=1.9.1",
]

[project.scripts]
vector-forge = "vector_forge:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

